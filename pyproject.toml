[project]
name = "cielircours"
version = "0.1.0"
description = "Outillage des dépôts de cours du BTS CIEL-IR : COURS.md vers PDF complet et PDF à trous"
requires-python = ">=3.12"
license = "CC-BY-NC-SA-4.0"
dependencies = [
    "markdown-it-py",
    "mdit-py-plugins",
    "weasyprint",
    "jinja2",
    "pyyaml",
]

[project.scripts]
cielir-cours = "cielircours.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pypdf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cielircours"]
