[project]
name = "cielircours"
version = "0.1.0"
description = "Outillage des dépôts de cours du BTS CIEL-IR : COURS.md vers PDF complet et PDF à trous"
requires-python = ">=3.12"
license = "CC-BY-NC-SA-4.0"
dependencies = [
    "markdown-it-py",
    "mdit-py-plugins",
    "weasyprint",
    "jinja2",
    "pyyaml",
]

[project.scripts]
cielir-cours = "cielircours.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pypdf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cielircours"]
# Les liens src/cielircours/donnees/* ne servent qu'à l'installation éditable (dev) :
# le wheel reçoit les vraies données par force-include, sans doublon.
exclude = ["src/cielircours/donnees"]

# Données de paquet : chaque dossier de données du dépôt est recopié sous
# cielircours/donnees/ et lu par importlib.resources.files("cielircours.donnees").
# Prochaines entrées : themes/, motifs.yml (ajouter ici ET un lien dans src/cielircours/donnees/).
[tool.hatch.build.targets.wheel.force-include]
"gabarits" = "cielircours/donnees/gabarits"
