[project]
name = "cielircours"
version = "0.1.0"
description = "Outillage des dépôts de cours du BTS CIEL-IR : COURS.md vers PDF complet et PDF à trous"
requires-python = ">=3.12"
license = "CC-BY-NC-SA-4.0"
dependencies = [
    "markdown-it-py",
    "mdit-py-plugins",
    "weasyprint",
    "jinja2",
    "pyyaml",
]

[project.scripts]
cielir-cours = "cielircours.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pypdf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cielircours"]
# Données de paquet (gabarits, thèmes, motifs…) : poser simplement les fichiers sous
# src/cielircours/donnees/ ; hatch les embarque seul, et on les lit par
# importlib.resources.files("cielircours.donnees"). Aucune autre déclaration à faire.

[tool.pytest.ini_options]
filterwarnings = [
    # Filtre ciblé : WeasyPrint annonce que libharfbuzz-subset deviendra obligatoire.
    # À retirer quand la bibliothèque est installée (action GitHub : tâche 10) ou quand
    # WeasyPrint rend l'avertissement caduc.
    "ignore:HarfBuzz-Subset will be required:DeprecationWarning",
]
