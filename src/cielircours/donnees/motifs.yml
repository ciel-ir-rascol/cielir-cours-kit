# Motifs d'information personnelle recherchés dans les dépôts de cours (publics).
# Le contrôle porte sur les fichiers du dépôt, jamais sur l'historique git.
#
# Chaque motif est une expression régulière (syntaxe Python). Une occurrence
# trouvée = une infraction. `exceptions` : expressions qui, si elles couvrent
# l'occurrence entière, l'écartent (adresses d'exemple réservées par la RFC 2606).

courriel:
  # Une partie hôte avec au moins un point : « root@localhost » n'est pas un courriel.
  expression: '[\w.+-]+@[\w-]+(?:\.[\w-]+)+'
  exceptions:
    # Exemples réservés par la RFC 2606.
    - '.*@(?:[\w-]+\.)*(?:example\.(?:com|net|org|edu)|[\w-]+\.(?:invalid|test|example))'
    # Accès git par SSH : git@github.com:org/depot.git
    - 'git@.*'
    # Connexion SSH/scp vers une adresse IP ou un nom d'hôte de réseau local.
    - '.*@\d{1,3}(?:\.\d{1,3}){3}'
    - '.*@(?:[\w-]+\.)+(?:local|lan|internal)'
    # Noms d'images pour écrans à haute densité : logo@2x.png
    - '.*@\d+x\.(?:png|jpe?g|gif|webp|svg)'

# Numéro français, avec un séparateur (espace, point, tiret, barre oblique, éventuellement répété) de même nature d'un bout
# à l'autre (longueur libre : l'extraction de PDF espace de façon irrégulière) ou sans séparateur :
#   0X XX XX XX XX, 0XXXXXXXXX, +33 X XX XX XX XX, +33 (0)X XX XX XX XX, 0033 ...
# Refusé : suite plus longue (chiffre ou « -xx », « .xx », « :xx », « xx » à la
# suite ou en amont : liste, adresse MAC) ou collée à un mot. Un faux positif se neutralise par
# .cielir-ignore ; un numéro manqué se publie.
telephone:
  expression: '(?<![\w.])(?<!\d[ .:/-])(?:(?:\+33|0033)[ .-]*(?:\(0\)[ .-]*)?[1-9](?:\d{8}|(?P<d>[ ./-])(?P=d)*\d{2}(?:(?P=d)+\d{2}){3})|0[1-9](?:\d{8}|(?P<c>[ ./-])(?P=c)*\d{2}(?:(?P=c)+\d{2}){3}))(?!\d|[ .:/-]\d\d)'

# Noms à ne pas publier, un par entrée, insensibles à la casse et à la mise en
# page (espaces multiples). Volontairement VIDE dans le kit : il est public, y
# écrire un nom reviendrait à le publier. Pour le remplir, copier ce fichier
# dans le dépôt concerné ou l'adapter localement, par exemple :
#   noms: ["Prénom Nom", "Nom"]
noms: []
